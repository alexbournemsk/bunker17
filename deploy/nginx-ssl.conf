# Порт 443. Подключается скриптом deploy/https.sh после выпуска сертификата
# (симлинк /etc/nginx/sites-enabled/bunker17-ssl -> этот файл). Сертификат продлевает certbot сам.
server {
    listen 443 ssl http2;
    server_name bunker17.ru www.bunker17.ru;

    ssl_certificate     /etc/letsencrypt/live/bunker17.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bunker17.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:bunker17ssl:10m;
    ssl_session_timeout 1d;

    if ($host = www.bunker17.ru) { return 301 https://bunker17.ru$request_uri; }

    root /opt/bunker17/www;
    index index.html;

    gzip on;
    gzip_types application/json;  # text/html сжимается по умолчанию

    location /api/ {
        proxy_pass http://127.0.0.1:8017;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
