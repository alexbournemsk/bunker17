# Порт 80. Пока HTTPS не включен - отдает игру как есть.
# После deploy/https.sh (появляется /etc/nginx/sites-enabled/bunker17-ssl) уводит все на https://bunker17.ru
server {
    listen 80;
    server_name _;
    root /opt/bunker17/www;
    index index.html;

    gzip on;
    gzip_types application/json;  # text/html сжимается по умолчанию

    # проверка Let's Encrypt при выпуске и продлении сертификата
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location /api/ {
        if (-f /etc/nginx/sites-enabled/bunker17-ssl) { return 301 https://bunker17.ru$request_uri; }
        proxy_pass http://127.0.0.1:8017;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        if (-f /etc/nginx/sites-enabled/bunker17-ssl) { return 301 https://bunker17.ru$request_uri; }
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
